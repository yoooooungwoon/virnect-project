<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRNECT 서버 모니터링</title>
<style>
  :root{--clean:#2e7d32;--warning:#f9a825;--danger:#c62828;--bg:#0f1117;--card:#1a1d27;--line:#2a2e3a;--mut:#9aa0ac;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:#e6e6e6;}
  header{padding:14px 22px;background:#13161f;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  header h1{font-size:17px;margin:0;}
  #status{font-size:13px;color:var(--mut);}
  .wrap{padding:18px 22px;display:flex;flex-direction:column;gap:20px;}
  .servers{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .server{background:var(--card);border-radius:12px;padding:14px;border-top:4px solid #444;}
  .server.clean{border-top-color:var(--clean);}.server.warning{border-top-color:var(--warning);}.server.danger{border-top-color:var(--danger);}
  .server h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;}
  .badge{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;}
  .badge.clean{background:var(--clean);}.badge.warning{background:var(--warning);}.badge.danger{background:var(--danger);}
  .mrow{display:flex;justify-content:space-between;font-size:13px;margin:5px 0;}
  .mrow .name{color:var(--mut);}
  .mrow .val.warning{color:var(--warning);}.mrow .val.danger{color:var(--danger);}
  .controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;}
  select{background:#222633;color:#e6e6e6;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:14px;height:4px;border-radius:2px;display:inline-block;}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;}
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .chart-card h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between;}
  .chart-card h3 .u{color:var(--mut);font-size:12px;font-weight:normal;}
  canvas{width:100%;height:200px;background:#0c0e14;border-radius:8px;}
  .panel{background:var(--card);border-radius:12px;padding:16px;}
  .panel h3{margin:0 0 12px;font-size:15px;}
  .alerts{max-height:280px;overflow:auto;}
  .alert{padding:9px 11px;border-radius:8px;margin-bottom:7px;font-size:13px;background:#222633;border-left:4px solid #555;}
  .alert.warning{border-left-color:var(--warning);}.alert.danger{border-left-color:var(--danger);}.alert.clean{border-left-color:var(--clean);}
  .alert .t{color:#888;font-size:11px;margin-top:3px;}
</style>
</head>
<body>
<header>
  <h1>🖥️ VIRNECT 서버 모니터링</h1>
  <span id="status">연결 중…</span>
</header>
<div class="wrap">
  <div class="servers" id="servers"></div>

  <div class="controls">
    <label>기간
      <select id="selRange">
        <option value="5">5분</option>
        <option value="15">15분</option>
        <option value="60" selected>1시간</option>
        <option value="360">6시간</option>
        <option value="1440">24시간</option>
      </select>
    </label>
    <div class="legend" id="legend"></div>
    <span id="chartInfo" style="color:var(--mut);font-size:12px;margin-left:auto;"></span>
  </div>

  <div class="charts" id="charts"></div>

  <div class="panel">
    <h3>🔔 알림 이력</h3>
    <div class="alerts" id="alerts"></div>
  </div>
</div>
<script>
const COLORS = ["#4f8cff","#2e9e6b","#f9a825","#e74c3c","#9b59ff","#16a3a3"];
const $ = (id) => document.getElementById(id);
let metricDefs = [];        // [{id,name,unit}]
let serverColor = {};       // server -> color

// ---------- 현재 상태 카드 (5초 폴링) ----------
async function loadStatus(){
  try{
    const data = await (await fetch("/api/status")).json();
    const servers = data.servers || {};
    renderServers(servers);
    ensureServerColors(Object.keys(servers).sort());
    $("status").textContent = data.ts ? "● 업데이트 " + new Date(data.ts*1000).toLocaleTimeString("ko-KR") : "● 대기";
  }catch(e){ $("status").textContent = "○ 연결 실패"; }
}
function renderServers(servers){
  const el = $("servers"); el.innerHTML = "";
  for(const name of Object.keys(servers).sort()){
    const s = servers[name];
    const rows = Object.values(s.metrics).map(m =>
      `<div class="mrow"><span class="name">${m.name}</span><span class="val ${m.level}">${m.display}</span></div>`).join("");
    el.insertAdjacentHTML("beforeend",
      `<div class="server ${s.overall}"><h2>${s.server}<span class="badge ${s.overall}">${s.overallText}</span></h2>${rows}</div>`);
  }
}
function ensureServerColors(names){
  let changed = false;
  names.forEach((n,i)=>{ if(!(n in serverColor)){ serverColor[n] = COLORS[i % COLORS.length]; changed = true; } });
  if(changed) renderLegend();
}
function renderLegend(){
  $("legend").innerHTML = Object.keys(serverColor).sort().map(n =>
    `<span><i style="background:${serverColor[n]}"></i>${n}</span>`).join("");
}

// ---------- 알림 이력 ----------
async function loadAlerts(){
  try{
    const list = await (await fetch("/api/alerts?limit=40")).json();
    $("alerts").innerHTML = list.map(a=>{
      const t = new Date(a.createdAt*1000).toLocaleString("ko-KR");
      return `<div class="alert ${a.level}">${a.message}<div class="t">${t}</div></div>`;
    }).join("") || `<div style="color:var(--mut);font-size:13px;">아직 알림이 없습니다.</div>`;
  }catch(e){}
}

// ---------- 시계열 차트 (지표별, 모든 서버 라인) ----------
function buildChartCards(){
  $("charts").innerHTML = metricDefs.map(d =>
    `<div class="chart-card"><h3>${d.name}<span class="u">${d.unit}</span></h3><canvas id="cv_${d.id}"></canvas></div>`).join("");
}
function stepFor(min){ return min<=5?10 : min<=15?15 : min<=60?30 : min<=360?120 : 600; }

async function loadCharts(){
  const min = parseInt($("selRange").value, 10);
  $("chartInfo").textContent = "불러오는 중…";
  await Promise.all(metricDefs.map(async d=>{
    try{
      const data = await (await fetch(`/api/history/${d.id}?minutes=${min}&step=${stepFor(min)}`)).json();
      drawChart($(`cv_${d.id}`), data.series || [], data.unit);
    }catch(e){}
  }));
  $("chartInfo").textContent = "기간 " + $("selRange").selectedOptions[0].text + " · " + new Date().toLocaleTimeString("ko-KR");
}

function fmtBytes(n){ const u=["","K","M","G"]; let i=0; while(Math.abs(n)>=1024&&i<3){n/=1024;i++;} return n.toFixed(0)+u[i]; }

function drawChart(cv, series, unit){
  const ctx = cv.getContext("2d");
  const W = cv.width = cv.clientWidth, H = cv.height = 200;
  ctx.clearRect(0,0,W,H);
  const all = series.flatMap(s=>s.points);
  if(!all.length){ ctx.fillStyle="#9aa0ac"; ctx.font="12px Segoe UI"; ctx.fillText("데이터 없음", W/2-32, H/2); return; }
  const pad = {l:46,r:10,t:10,b:20};
  const xs = all.map(p=>p[0]), ys = all.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0, y1;
  if(unit==="%"){ y0=0; y1=Math.max(100, Math.max(...ys)); }
  else { y0=0; y1=Math.max(...ys)*1.15 || 1; }
  const px=(x)=>pad.l+(x-x0)/((x1-x0)||1)*(W-pad.l-pad.r);
  const py=(y)=>H-pad.b-(y-y0)/((y1-y0)||1)*(H-pad.t-pad.b);
  // grid + y labels
  ctx.strokeStyle="#2a2e3a"; ctx.fillStyle="#9aa0ac"; ctx.font="11px Segoe UI"; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=y0+(y1-y0)*i/4, yy=py(y);
    ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(W-pad.r,yy); ctx.stroke();
    ctx.fillText(unit==="%"?y.toFixed(0):fmtBytes(y), 4, yy+3); }
  // x labels
  ctx.fillText(new Date(x0*1000).toLocaleTimeString("ko-KR"), pad.l, H-5);
  ctx.fillText(new Date(x1*1000).toLocaleTimeString("ko-KR"), W-pad.r-52, H-5);
  // lines per server
  ctx.lineWidth=2;
  series.forEach(s=>{
    ctx.strokeStyle = serverColor[s.server] || "#4f8cff";
    ctx.beginPath();
    s.points.forEach((p,i)=>{ const X=px(p[0]),Y=py(p[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
    ctx.stroke();
  });
}

// ---------- 시작 ----------
(async()=>{
  try{ metricDefs = (await (await fetch("/api/metrics")).json()).metrics; }catch(e){}
  buildChartCards();
  $("selRange").onchange = loadCharts;
  await loadStatus();
  await loadAlerts();
  await loadCharts();
  setInterval(loadStatus, 5000);
  setInterval(loadAlerts, 5000);
  setInterval(loadCharts, 30000);
  window.addEventListener("resize", ()=>{ clearTimeout(window._rz); window._rz=setTimeout(loadCharts,300); });
})();
</script>
</body>
</html>
