<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIRNECT 시스템 모니터</title>
<style>
  :root{
    --blue:#27349b;--red:#ff3928;--mint:#b7d7ce;--sky:#79aeca;--lime:#bfd458;
    --ink:#18203a;--muted:#7f8797;--page:#f7f8fb;--panel:#fff;--line:#e6e8ef;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Malgun Gothic",sans-serif;background:var(--page);color:var(--ink)}
  header{max-width:1180px;margin:0 auto;padding:24px 28px 6px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
  h1{margin:0;color:var(--blue);font-size:30px;line-height:1.1;font-weight:800}
  #status{color:var(--muted);font-size:13px;margin-bottom:2px}
  main{max-width:1180px;margin:0 auto;padding:20px 28px 34px;display:flex;flex-direction:column;gap:28px}
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  select{height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:0 10px;font-size:13px}
  .section-title{margin:0;color:var(--blue);font-size:18px;font-weight:800}
  .server-tabs{display:flex;gap:8px;flex-wrap:wrap}
  .server-tab{border:1px solid var(--line);background:#fff;color:var(--blue);border-radius:6px;padding:8px 12px;font-weight:700;cursor:pointer}
  .server-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 32px}
  .metric-card{min-height:178px;background:var(--panel);border:3px solid currentColor;border-radius:26px;padding:22px 26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .metric-card h2{margin:0;font-size:21px;line-height:1;color:currentColor;font-weight:800;letter-spacing:0}
  .metric-card .value{font-size:38px;font-weight:800;line-height:1.1;color:currentColor}
  .metric-card .sub{color:var(--muted);font-size:12px;margin-top:7px}
  .metric-card .level{align-self:flex-start;border-radius:999px;border:1px solid currentColor;padding:4px 9px;font-size:12px;font-weight:700}
  .metric-card.red{color:var(--red)}.metric-card.mint{color:var(--mint)}.metric-card.sky{color:var(--sky)}
  .metric-card.lime{color:var(--lime)}.metric-card.blue{color:var(--blue)}
  .chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 44px}
  .chart-card{height:194px;background:var(--panel);border:3px solid currentColor;border-radius:24px;padding:16px 22px;color:var(--blue)}
  .chart-card h3{margin:0 0 8px;font-size:20px;line-height:1;color:currentColor}
  .chart-card.red{color:var(--red)}.chart-card.mint{color:var(--mint)}.chart-card.sky{color:var(--sky)}
  .chart-card.lime{color:var(--lime)}.chart-card.blue{color:var(--blue)}
  canvas{display:block;width:100%;height:128px}
  .empty{color:var(--muted);font-size:14px;padding:30px 0}
  @media (max-width:900px){
    .metric-grid,.chart-grid{grid-template-columns:1fr}
    header,main{padding-left:18px;padding-right:18px}
    h1{font-size:26px}
  }
</style>
</head>
<body>
<header>
  <h1>시스템 모니터</h1>
  <span id="status">연결 대기 중</span>
</header>
<main>
  <div class="toolbar">
    <h2 class="section-title">실시간 수치</h2>
    <div class="server-tabs" id="serverTabs"></div>
  </div>
  <section class="metric-grid" id="metricCards"></section>

  <div class="toolbar">
    <h2 class="section-title">실시간 그래프</h2>
    <select id="selRange" aria-label="그래프 기간">
      <option value="5">5분</option>
      <option value="15">15분</option>
      <option value="60" selected>1시간</option>
      <option value="360">6시간</option>
      <option value="1440">24시간</option>
    </select>
  </div>
  <section class="chart-grid" id="charts"></section>
</main>
<script>
const METRICS = [
  {id:"cpu", label:"CPU 사용률", color:"red"},
  {id:"memory", label:"메모리 사용률", color:"mint"},
  {id:"disk", label:"디스크 사용률(C:)", color:"lime"},
  {id:"net_recv", label:"네트워크 수신량", color:"blue"},
  {id:"net_sent", label:"네트워크 송신량", color:"sky"}
];
const $ = (id) => document.getElementById(id);
let selectedServer = "";
let lastServers = {};

function stepFor(min){ return min<=5?10 : min<=15?15 : min<=60?30 : min<=360?120 : 600; }
function fmtBytes(n){
  const units=["B/s","KB/s","MB/s","GB/s"]; let i=0;
  while(Math.abs(n)>=1024 && i<units.length-1){ n/=1024; i++; }
  return `${n.toFixed(1)} ${units[i]}`;
}
function displayMetric(m){
  if(!m) return "-";
  if(m.unit === "B/s") return fmtBytes(m.value);
  if(m.unit === "%") return `${m.value.toFixed(1)}%`;
  return m.display || String(m.value);
}
function levelText(m){ return m?.levelText || "-"; }

async function loadStatus(){
  try{
    const data = await (await fetch("/api/status")).json();
    lastServers = data.servers || {};
    const names = Object.keys(lastServers).sort();
    if(!selectedServer || !lastServers[selectedServer]) selectedServer = names[0] || "";
    renderTabs(names);
    renderCards();
    $("status").textContent = data.ts ? `업데이트 ${new Date(data.ts*1000).toLocaleTimeString("ko-KR")}` : "데이터 대기 중";
  }catch(e){
    $("status").textContent = "연결 실패";
  }
}
function renderTabs(names){
  $("serverTabs").innerHTML = names.map(name =>
    `<button class="server-tab ${name===selectedServer?"active":""}" data-server="${name}">${name}</button>`).join("");
  document.querySelectorAll(".server-tab").forEach(btn => btn.onclick = async () => {
    selectedServer = btn.dataset.server;
    renderTabs(names);
    renderCards();
    await loadCharts();
  });
}
function renderCards(){
  const server = lastServers[selectedServer];
  if(!server){ $("metricCards").innerHTML = `<div class="empty">표시할 서버 데이터가 없습니다.</div>`; return; }
  $("metricCards").innerHTML = METRICS.map(def => {
    const m = server.metrics?.[def.id];
    return `<article class="metric-card ${def.color}">
      <h2>${def.label}</h2>
      <div>
        <div class="value">${displayMetric(m)}</div>
        <div class="sub">${selectedServer}</div>
      </div>
      <span class="level">${levelText(m)}</span>
    </article>`;
  }).join("");
}
function buildCharts(){
  $("charts").innerHTML = METRICS.map(def =>
    `<article class="chart-card ${def.color}"><h3>${def.label}</h3><canvas id="cv_${def.id}"></canvas></article>`).join("");
}
async function loadCharts(){
  if(!selectedServer) return;
  const min = parseInt($("selRange").value, 10);
  await Promise.all(METRICS.map(async def => {
    try{
      const data = await (await fetch(`/api/history/${selectedServer}/${def.id}?minutes=${min}&step=${stepFor(min)}`)).json();
      drawLine($(`cv_${def.id}`), data.points || [], def.color, data.unit);
    }catch(e){
      drawLine($(`cv_${def.id}`), [], def.color, "%");
    }
  }));
}
function colorValue(name){
  return getComputedStyle(document.documentElement).getPropertyValue(`--${name}`).trim() || "#27349b";
}
function drawLine(canvas, points, colorName, unit){
  const ctx = canvas.getContext("2d");
  const W = canvas.width = canvas.clientWidth;
  const H = canvas.height = canvas.clientHeight || 128;
  ctx.clearRect(0,0,W,H);
  if(!points.length){
    ctx.fillStyle = "#9aa0ac";
    ctx.font = "13px Segoe UI";
    ctx.fillText("데이터 없음", 12, H/2);
    return;
  }
  const pad = {l:2,r:2,t:10,b:10};
  const xs = points.map(p=>p[0]), ys = points.map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const yMax = unit === "%" ? Math.max(100, Math.max(...ys)) : Math.max(...ys) * 1.15 || 1;
  const px = x => pad.l + (x-x0)/((x1-x0)||1)*(W-pad.l-pad.r);
  const py = y => H-pad.b - (y/yMax)*(H-pad.t-pad.b);
  ctx.strokeStyle = colorValue(colorName);
  ctx.lineWidth = 5;
  ctx.lineJoin = "miter";
  ctx.lineCap = "butt";
  ctx.beginPath();
  points.forEach((p,i)=>{ const x=px(p[0]), y=py(p[1]); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
  ctx.stroke();
}

(async()=>{
  buildCharts();
  $("selRange").onchange = loadCharts;
  await loadStatus();
  await loadCharts();
  setInterval(async()=>{ await loadStatus(); }, 5000);
  setInterval(loadCharts, 30000);
  window.addEventListener("resize", ()=>{ clearTimeout(window._rz); window._rz=setTimeout(loadCharts,250); });
})();
</script>
</body>
</html>
