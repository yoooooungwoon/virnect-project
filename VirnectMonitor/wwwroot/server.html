<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서버 모니터링</title>
<style>
  :root{--clean:#2e7d32;--warning:#f9a825;--danger:#c62828;--bg:#0f1117;--card:#1a1d27;--line:#2a2e3a;--mut:#9aa0ac;--accent:#4f8cff;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:#e6e6e6;}
  header{padding:14px 22px;background:#13161f;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  header h1{font-size:18px;margin:0;}
  header .badge{font-size:12px;padding:3px 10px;border-radius:10px;color:#fff;}
  .badge.clean{background:var(--clean);}.badge.warning{background:var(--warning);}.badge.danger{background:var(--danger);}
  #status{font-size:13px;color:var(--mut);}
  a.back{color:var(--accent);text-decoration:none;font-size:13px;}
  .wrap{padding:18px 22px;display:flex;flex-direction:column;gap:18px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .panel h3{margin:0 0 12px;font-size:15px;}
  .alerts{max-height:220px;overflow:auto;}
  .alert{padding:9px 11px;border-radius:8px;margin-bottom:7px;font-size:13px;background:#222633;border-left:4px solid #555;}
  .alert.warning{border-left-color:var(--warning);}.alert.danger{border-left-color:var(--danger);}.alert.clean{border-left-color:var(--clean);}
  .alert .t{color:#888;font-size:11px;margin-top:3px;}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .tile{background:#222633;border-radius:10px;padding:12px 14px;border-top:3px solid #444;}
  .tile.clean{border-top-color:var(--clean);}.tile.warning{border-top-color:var(--warning);}.tile.danger{border-top-color:var(--danger);}
  .tile .n{color:var(--mut);font-size:12px;}
  .tile .v{font-size:22px;font-weight:700;margin-top:4px;}
  .tile .v.warning{color:var(--warning);}.tile .v.danger{color:var(--danger);}
  .controls{display:flex;gap:12px;align-items:center;}
  select{background:#222633;color:#e6e6e6;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px;}
  .chart-card{background:#222633;border-radius:10px;padding:12px;}
  .chart-card h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;}
  .chart-card h4 .u{color:var(--mut);font-weight:normal;}
  canvas{width:100%;height:180px;background:#0c0e14;border-radius:8px;}
</style>
</head>
<body>
<header>
  <h1 id="title">서버</h1>
  <span class="badge clean" id="overall">-</span>
  <span id="status"></span>
  <a class="back" href="/">← 전체 통합 보기</a>
</header>
<div class="wrap">
  <!-- 알림 (맨 위) -->
  <div class="panel">
    <h3>🔔 알림 이력</h3>
    <div class="alerts" id="alerts"></div>
  </div>

  <!-- 현재 상태 -->
  <div class="panel">
    <h3>현재 상태</h3>
    <div class="tiles" id="tiles"></div>
  </div>

  <!-- 시계열 -->
  <div class="panel">
    <h3 style="display:flex;justify-content:space-between;align-items:center;">
      <span>📈 시계열 추이</span>
      <span class="controls">
        <select id="selRange">
          <option value="5">5분</option>
          <option value="15">15분</option>
          <option value="60" selected>1시간</option>
          <option value="360">6시간</option>
          <option value="1440">24시간</option>
        </select>
      </span>
    </h3>
    <div class="charts" id="charts"></div>
  </div>
</div>
<script>
const server = new URLSearchParams(location.search).get("server") || "server-01";
const $ = (id) => document.getElementById(id);
let metricDefs = [];
document.title = server + " 모니터링";
$("title").textContent = "🖥️ " + server;

async function loadStatus(){
  try{
    const s = await (await fetch(`/api/server/${server}`)).json();
    if(s.error){ $("status").textContent = "○ 서버 없음"; return; }
    $("overall").className = "badge " + s.overall;
    $("overall").textContent = s.overallText;
    $("status").textContent = "● 업데이트 " + new Date(s.updatedAt*1000).toLocaleTimeString("ko-KR");
    $("tiles").innerHTML = Object.values(s.metrics).map(m =>
      `<div class="tile ${m.level}"><div class="n">${m.name}</div><div class="v ${m.level}">${m.display}</div></div>`).join("");
  }catch(e){ $("status").textContent = "○ 연결 실패"; }
}

async function loadAlerts(){
  try{
    const list = await (await fetch(`/api/alerts?server=${server}&limit=40`)).json();
    $("alerts").innerHTML = list.map(a=>{
      const t = new Date(a.createdAt*1000).toLocaleString("ko-KR");
      return `<div class="alert ${a.level}">${a.message}<div class="t">${t}</div></div>`;
    }).join("") || `<div style="color:var(--mut);font-size:13px;">이 서버의 알림이 없습니다.</div>`;
  }catch(e){}
}

function buildCards(){
  $("charts").innerHTML = metricDefs.map(d =>
    `<div class="chart-card"><h4>${d.name}<span class="u">${d.unit}</span></h4><canvas id="cv_${d.id}"></canvas></div>`).join("");
}
function stepFor(min){ return min<=5?10 : min<=15?15 : min<=60?30 : min<=360?120 : 600; }

async function loadCharts(){
  const min = parseInt($("selRange").value, 10);
  await Promise.all(metricDefs.map(async d=>{
    try{
      const data = await (await fetch(`/api/history/${server}/${d.id}?minutes=${min}&step=${stepFor(min)}`)).json();
      drawChart($(`cv_${d.id}`), data.points || [], data.unit);
    }catch(e){}
  }));
}
function fmtBytes(n){ const u=["","K","M","G"]; let i=0; while(Math.abs(n)>=1024&&i<3){n/=1024;i++;} return n.toFixed(0)+u[i]; }
function drawChart(cv, points, unit){
  const ctx = cv.getContext("2d");
  const W = cv.width = cv.clientWidth, H = cv.height = 180;
  ctx.clearRect(0,0,W,H);
  if(!points.length){ ctx.fillStyle="#9aa0ac"; ctx.font="12px Segoe UI"; ctx.fillText("데이터 없음", W/2-32, H/2); return; }
  const pad={l:46,r:10,t:10,b:20};
  const xs=points.map(p=>p[0]), ys=points.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  let y0=0, y1 = unit==="%" ? Math.max(100,Math.max(...ys)) : (Math.max(...ys)*1.15 || 1);
  const px=x=>pad.l+(x-x0)/((x1-x0)||1)*(W-pad.l-pad.r);
  const py=y=>H-pad.b-(y-y0)/((y1-y0)||1)*(H-pad.t-pad.b);
  ctx.strokeStyle="#2a2e3a"; ctx.fillStyle="#9aa0ac"; ctx.font="11px Segoe UI"; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=y0+(y1-y0)*i/4, yy=py(y);
    ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(W-pad.r,yy); ctx.stroke();
    ctx.fillText(unit==="%"?y.toFixed(0):fmtBytes(y), 4, yy+3); }
  ctx.fillText(new Date(x0*1000).toLocaleTimeString("ko-KR"), pad.l, H-5);
  ctx.fillText(new Date(x1*1000).toLocaleTimeString("ko-KR"), W-pad.r-52, H-5);
  ctx.strokeStyle="#4f8cff"; ctx.lineWidth=2; ctx.beginPath();
  points.forEach((p,i)=>{ const X=px(p[0]),Y=py(p[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); }); ctx.stroke();
}

(async()=>{
  try{ metricDefs = (await (await fetch("/api/metrics")).json()).metrics; }catch(e){}
  buildCards();
  $("selRange").onchange = loadCharts;
  await loadStatus(); await loadAlerts(); await loadCharts();
  setInterval(loadStatus, 5000);
  setInterval(loadAlerts, 5000);
  setInterval(loadCharts, 30000);
  window.addEventListener("resize", ()=>{ clearTimeout(window._rz); window._rz=setTimeout(loadCharts,300); });
})();
</script>
</body>
</html>
