<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서버 시스템 모니터 테스트</title>
<style>
  :root{
    --blue:#27349b;--green:#2fb344;--orange:#f59f00;--red:#ff3928;
    --ink:#18203a;--muted:#7f8797;--page:#f7f8fb;--line:#e6e8ef;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI","Malgun Gothic",sans-serif;background:var(--page);color:var(--ink)}
  header{max-width:1100px;margin:0 auto;padding:24px 28px 6px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  h1{margin:0;color:var(--blue);font-size:30px;line-height:1.1;font-weight:800}
  #status{color:var(--muted);font-size:13px;margin-bottom:2px}
  a{color:var(--blue);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:2px}
  main{max-width:1100px;margin:0 auto;padding:20px 28px 34px;display:flex;flex-direction:column;gap:28px}
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .section-title{margin:0;color:var(--blue);font-size:18px;font-weight:800}
  .test-badge{background:var(--red);color:#fff;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-left:8px}
  select{height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:0 10px;font-size:13px}
  .metric-grid{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px}
  .metric-card{min-height:118px;background:#ffffff;border:3px solid currentColor;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
  .metric-card h2{margin:0;font-size:16px;line-height:1.2;color:currentColor;font-weight:800}
  .metric-card .value{font-size:25px;font-weight:800;line-height:1.1;color:#111;white-space:nowrap}
  .metric-card .sub{color:var(--muted);font-size:12px;margin-top:4px;text-align:left}
  .metric-card .level{align-self:flex-start;border-radius:999px;border:1px solid currentColor;color:currentColor;padding:4px 9px;font-size:12px;font-weight:700}
  .metric-card.safe{color:var(--green)}
  .metric-card.warning{color:var(--orange)}
  .metric-card.danger{color:var(--red)}
  .chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 44px}
  .chart-card{height:248px;background:#ffffff;border:3px solid var(--blue);border-radius:24px;padding:16px 22px}
  .chart-card h3{margin:0 0 8px;font-size:20px;line-height:1;color:var(--blue)}
  canvas{display:block;width:100%;height:182px}
  @media (max-width:900px){
    .metric-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
    .chart-grid{grid-template-columns:1fr}
    header,main{padding-left:18px;padding-right:18px}
    h1{font-size:26px}
  }
</style>
</head>
<body>
<header>
  <h1 id="title">시스템 모니터<span class="test-badge">테스트 모드</span></h1>
  <span id="status">테스트 데이터 로드 중</span>
  <a href="/index_test.html">전체 보기</a>
</header>
<main>
  <div class="toolbar">
    <h2 class="section-title">실시간 수치</h2>
  </div>
  <section class="metric-grid" id="metricCards"></section>

  <div class="toolbar">
    <h2 class="section-title">실시간 그래프</h2>
    <select id="selRange" aria-label="그래프 기간">
      <option value="5">5분</option>
      <option value="15">15분</option>
      <option value="60" selected>1시간</option>
      <option value="360">6시간</option>
      <option value="1440">24시간</option>
    </select>
  </div>
  <section class="chart-grid" id="charts"></section>
</main>
<script>
const METRICS = [
  {id:"cpu", label:"CPU 사용률"},
  {id:"memory", label:"메모리 사용률"},
  {id:"disk", label:"디스크 사용률(C:)"},
  {id:"net_recv", label:"네트워크 수신량"},
  {id:"net_sent", label:"네트워크 송신량"}
];
const AXES = {
  cpu: {max:100, ticks:[0,25,50,75,100], labels:["0","25","50","75","100"]},
  memory: {max:100, ticks:[0,25,50,75,100], labels:["0","25","50","75","100"]},
  disk: {max:100, ticks:[0,25,50,75,100], labels:["0","25","50","75","100"]},
  net_recv: {max:720000, ticks:[0,180000,360000,540000,720000], labels:["0k","180k","360k","540k","720k"]},
  net_sent: {max:158000, ticks:[0,39000,79000,118000,158000], labels:["0k","39k","79k","118k","158k"]}
};
const THRESHOLDS = {
  cpu: {warning:85, danger:95},
  memory: {warning:85, danger:95},
  disk: {warning:90, danger:95},
  net_recv: {warning:612000, danger:684000},
  net_sent: {warning:134300, danger:150100}
};
const METRIC_UNITS = {cpu:"%", memory:"%", disk:"%", net_recv:"B/s", net_sent:"B/s"};
const LEVEL_LABELS = {safe:"안전", warning:"경고", danger:"위험"};
const DUMMY_SERVERS = {
  "server-01": {cpu:42, memory:64, disk:58, net_recv:230000, net_sent:42000},
  "server-02": {cpu:88, memory:72, disk:67, net_recv:638000, net_sent:82000},
  "server-03": {cpu:54, memory:96, disk:92, net_recv:310000, net_sent:151500},
  "server-04": {cpu:97, memory:78, disk:96, net_recv:690000, net_sent:56000}
};
const $ = (id) => document.getElementById(id);
const requestedServer = new URLSearchParams(location.search).get("server")
  || (location.pathname.match(/server-\d+/) || [])[0]
  || "server-01";
const server = DUMMY_SERVERS[requestedServer] ? requestedServer : "server-01";
document.title = `${server} 시스템 모니터 테스트`;
$("title").innerHTML = `${server} 시스템 모니터<span class="test-badge">테스트 모드</span>`;

function stepFor(min){ return min<=5?10 : min<=15?15 : min<=60?30 : min<=360?120 : 600; }
function metricName(id){ return METRICS.find(m => m.id === id)?.label || id; }
function fmtBytes(n){
  const units = ["B/s","KB/s","MB/s","GB/s"];
  let i = 0;
  while(Math.abs(n) >= 1024 && i < units.length - 1){ n /= 1024; i++; }
  return `${n.toFixed(1)} ${units[i]}`;
}
function displayMetric(metricId, value){
  return METRIC_UNITS[metricId] === "B/s" ? fmtBytes(value) : `${value.toFixed(1)}%`;
}
function fmtDate(ts){
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function zoneFor(metricId, value){
  const t = THRESHOLDS[metricId];
  if(value >= t.danger) return "danger";
  if(value >= t.warning) return "warning";
  return "safe";
}
function zoneColor(zone){
  return zone === "danger" ? "#ff3928" : zone === "warning" ? "#f59f00" : "#2fb344";
}
function stableWave(i, seed){
  return Math.sin(i * 0.72 + seed) * 0.55 + Math.cos(i * 0.19 + seed) * 0.45;
}
function serverNo(name){ return parseInt((name.match(/\d+$/) || ["1"])[0], 10); }
function liveValue(metricId, ts){
  const base = DUMMY_SERVERS[server][metricId];
  const variance = metricId.startsWith("net_") ? base * 0.14 : 7;
  const metricIndex = METRICS.findIndex(m => m.id === metricId) + 1;
  const seed = serverNo(server) * 1.7 + metricIndex * 0.9;
  const raw = base
    + stableWave(ts / 18, seed) * variance
    + Math.sin(ts / 47 + seed) * variance * 0.28;
  return Math.max(0, Math.min(AXES[metricId].max, raw));
}
function generateTestData(metricId, minutes){
  const points = [];
  const now = Math.floor(Date.now() / 1000);
  const step = stepFor(minutes);
  for(let i = minutes * 60; i >= 0; i -= step){
    const timestamp = now - i;
    points.push([timestamp, liveValue(metricId, timestamp)]);
  }
  return points;
}
function renderCards(){
  const now = Math.floor(Date.now() / 1000);
  $("metricCards").innerHTML = METRICS.map(def => {
    const value = liveValue(def.id, now);
    const zone = zoneFor(def.id, value);
    return `<article class="metric-card ${zone}">
      <h2>${def.label}</h2>
      <div>
        <div class="value">${displayMetric(def.id, value)}</div>
        <div class="sub">${server}</div>
      </div>
      <span class="level">${LEVEL_LABELS[zone]}</span>
    </article>`;
  }).join("");
}
function buildCharts(){
  $("charts").innerHTML = METRICS.map(def =>
    `<article class="chart-card"><h3>${def.label}</h3><canvas id="cv_${def.id}"></canvas></article>`).join("");
}
async function loadStatus(){
  $("status").textContent = `테스트 데이터 - 업데이트 ${fmtDate(Math.floor(Date.now() / 1000))}`;
  renderCards();
}
async function loadCharts(){
  const min = parseInt($("selRange").value, 10);
  METRICS.forEach(def => drawLine($(`cv_${def.id}`), generateTestData(def.id, min), def.id));
}
function drawBase(ctx, W, H, points, metricId){
  const axis = AXES[metricId];
  const pad = {l:42,r:8,t:8,b:24};
  const xs = points.map(p=>p[0]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const px = x => pad.l + (x-x0)/((x1-x0)||1)*(W-pad.l-pad.r);
  const py = y => H-pad.b - (y/axis.max)*(H-pad.t-pad.b);
  ctx.font = "11px Segoe UI";
  ctx.lineWidth = 1;
  ctx.textBaseline = "middle";
  axis.ticks.forEach((tickValue, i) => {
    const y = py(tickValue);
    ctx.strokeStyle = "#e6e8ef";
    ctx.beginPath();
    ctx.moveTo(pad.l, y);
    ctx.lineTo(W-pad.r, y);
    ctx.stroke();
    ctx.fillStyle = "#7f8797";
    ctx.textAlign = "right";
    ctx.fillText(axis.labels[i], pad.l-7, y);
  });
  ctx.textBaseline = "top";
  [x0, (x0+x1)/2, x1].forEach((value, i) => {
    ctx.textAlign = i === 0 ? "left" : i === 2 ? "right" : "center";
    ctx.fillText(new Date(value*1000).toLocaleTimeString("ko-KR", {hour:"2-digit", minute:"2-digit"}), px(value), H-17);
  });
  return {px, py};
}
function drawSegmentedLine(ctx, points, metricId, px, py){
  ctx.lineWidth = 1;
  ctx.lineJoin = "miter";
  ctx.lineCap = "butt";
  for(let i=1;i<points.length;i++){
    const zone = zoneFor(metricId, Math.max(points[i-1][1], points[i][1]));
    ctx.strokeStyle = zoneColor(zone);
    ctx.beginPath();
    ctx.moveTo(px(points[i-1][0]), py(points[i-1][1]));
    ctx.lineTo(px(points[i][0]), py(points[i][1]));
    ctx.stroke();
  }
}
function drawLine(canvas, points, metricId){
  const ctx = canvas.getContext("2d");
  const W = canvas.width = canvas.clientWidth;
  const H = canvas.height = canvas.clientHeight || 182;
  ctx.clearRect(0,0,W,H);
  if(!points.length){
    ctx.fillStyle = "#9aa0ac";
    ctx.font = "13px Segoe UI";
    ctx.fillText("No data", 12, H/2);
    return;
  }
  const base = drawBase(ctx, W, H, points, metricId);
  drawSegmentedLine(ctx, points, metricId, base.px, base.py);
}

(async()=>{
  buildCharts();
  $("selRange").onchange = loadCharts;
  await loadStatus();
  await loadCharts();
  setInterval(loadStatus, 1000);
  setInterval(loadCharts, 5000);
  window.addEventListener("resize", ()=>{ clearTimeout(window._rz); window._rz=setTimeout(loadCharts,250); });
})();
</script>
</body>
</html>
