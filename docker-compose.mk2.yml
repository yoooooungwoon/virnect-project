# mk2 deployment for the moni-back-graph branch.
# This file is intentionally separate from docker-compose.yml so the current
# monitor.yongun.shop deployment can keep running unchanged.
services:
  virnect-monitor-mk2:
    build:
      context: ./VirnectMonitor
      dockerfile: Dockerfile
    container_name: virnect-monitor-mk2
    environment:
      - Monitor__PrometheusUrl=http://prometheus:9090
      - ASPNETCORE_URLS=http://0.0.0.0:47892
      - Monitor__DbPath=/data/monitoring-mk2.db
    volumes:
      - monitor-mk2-data:/data
    networks:
      - prometheus_default
      - moni-mk2-net
    restart: unless-stopped

  cloudflared-mk2:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-mk2
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${MK2_TUNNEL_TOKEN}
    networks:
      - moni-mk2-net
    depends_on:
      - virnect-monitor-mk2
    restart: unless-stopped

networks:
  prometheus_default:
    external: true
  moni-mk2-net:
    driver: bridge

volumes:
  monitor-mk2-data:
