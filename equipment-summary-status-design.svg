<svg width="1400" height="920" viewBox="0 0 1400 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1400" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EEF4F8"/>
    </linearGradient>
    <style>
      .title { font-family: "Segoe UI", "Pretendard", Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #152033; }
      .subtitle { font-family: "Segoe UI", "Pretendard", Arial, sans-serif; font-size: 17px; font-weight: 500; fill: #617083; }
      .panelTitle { font-family: "Segoe UI", "Pretendard", Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #182336; }
      .label { font-family: "Segoe UI", "Pretendard", Arial, sans-serif; font-size: 15px; font-weight: 650; fill: #6B7788; }
      .body { font-family: "Segoe UI", "Pretendard", Arial, sans-serif; font-size: 17px; font-weight: 600; fill: #223044; }
      .small { font-family: "Segoe UI", "Pretendard", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #718096; }
      .code { font-family: "Cascadia Mono", "Consolas", monospace; font-size: 14px; font-weight: 600; fill: #27364A; }
      .danger { fill: #E5484D; }
      .warning { fill: #D98A00; }
      .clean { fill: #168A4A; }
      .off { fill: #7A8594; }
      .card { fill: #FFFFFF; stroke: #D9E2EC; stroke-width: 1.3; filter: url(#shadow); }
      .softCard { fill: #FFFFFF; stroke: #DFE7EF; stroke-width: 1.2; }
      .chip { fill: #F3F7FA; stroke: #E0E8F0; stroke-width: 1; }
      .arrow { stroke: #96A3B4; stroke-width: 2.2; marker-end: url(#arrowHead); }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#96A3B4"/>
    </marker>
  </defs>

  <rect width="1400" height="920" fill="url(#pageBg)"/>

  <text x="64" y="70" class="title">장비요약 상태 설계</text>
  <text x="64" y="102" class="subtitle">Make&amp;View는 요약 API만 보고 카드와 색상을 결정하고, 상세 API는 그래프 화면에서만 사용합니다.</text>

  <!-- Main status card preview -->
  <rect x="64" y="146" width="396" height="408" rx="18" class="card"/>
  <text x="96" y="198" class="body" style="font-size:22px;font-weight:800;">server-01</text>
  <circle cx="384" cy="190" r="7" fill="#19A35B"/>
  <text x="400" y="198" class="body" style="font-size:18px;font-weight:800;">ON</text>

  <text x="96" y="255" class="label">운영상태</text>
  <text x="96" y="312" class="danger" style="font-family:'Segoe UI','Pretendard',Arial,sans-serif;font-size:56px;font-weight:900;">위험</text>
  <rect x="272" y="270" width="112" height="46" rx="23" fill="#FFF1F1" stroke="#F5C2C7"/>
  <text x="302" y="300" class="danger" style="font-family:'Segoe UI','Pretendard',Arial,sans-serif;font-size:16px;font-weight:800;">code 3</text>

  <text x="96" y="358" class="body">CPU 사용률, 서비스 상태 확인 필요</text>
  <text x="96" y="392" class="small">checkMessage 한 줄 문구를 그대로 표시</text>

  <line x1="96" y1="424" x2="428" y2="424" stroke="#E8EEF4"/>
  <text x="96" y="466" class="label">알림수</text>
  <text x="372" y="466" class="body" style="font-size:24px;font-weight:900;text-anchor:end;">2건</text>
  <text x="96" y="504" class="small">alertNum = 경고/위험 지표 개수</text>

  <!-- Mini metric strips -->
  <rect x="64" y="582" width="396" height="196" rx="18" class="card"/>
  <text x="96" y="632" class="panelTitle">하단 미니 지표</text>
  <text x="96" y="662" class="small">각 지표 API의 display와 levelCode만 사용</text>

  <rect x="96" y="692" width="148" height="52" rx="12" fill="#FFF7E8" stroke="#F5D49B"/>
  <text x="112" y="715" class="small">CPU</text>
  <text x="112" y="736" class="body">83.2%</text>
  <circle cx="222" cy="718" r="6" fill="#D98A00"/>

  <rect x="276" y="692" width="148" height="52" rx="12" fill="#FFF1F1" stroke="#F5C2C7"/>
  <text x="292" y="715" class="small">서비스</text>
  <text x="292" y="736" class="body">중지</text>
  <circle cx="402" cy="718" r="6" fill="#E5484D"/>

  <rect x="96" y="758" width="148" height="52" rx="12" fill="#EEF9F2" stroke="#BDE5CA"/>
  <text x="112" y="781" class="small">메모리</text>
  <text x="112" y="802" class="body">48.1%</text>
  <circle cx="222" cy="784" r="6" fill="#168A4A"/>

  <rect x="276" y="758" width="148" height="52" rx="12" fill="#FFF7E8" stroke="#F5D49B"/>
  <text x="292" y="781" class="small">디스크</text>
  <text x="292" y="802" class="body">82.4%</text>
  <circle cx="402" cy="784" r="6" fill="#D98A00"/>

  <!-- Decision panel -->
  <rect x="504" y="146" width="408" height="632" rx="18" class="card"/>
  <text x="536" y="198" class="panelTitle">운영상태 판단 순서</text>
  <text x="536" y="228" class="small">위에서 먼저 걸리는 조건이 최종 operationCode가 됩니다.</text>

  <rect x="536" y="264" width="344" height="70" rx="14" fill="#F4F6F8" stroke="#DCE4EC"/>
  <circle cx="566" cy="299" r="14" fill="#7A8594"/>
  <text x="561" y="304" fill="#FFFFFF" style="font-family:'Segoe UI';font-size:14px;font-weight:800;">0</text>
  <text x="596" y="292" class="body">powercode = 0</text>
  <text x="596" y="316" class="small">전원 OFF, operationCode = 0</text>

  <line x1="708" y1="334" x2="708" y2="363" class="arrow"/>

  <rect x="536" y="366" width="344" height="78" rx="14" fill="#FFF1F1" stroke="#F5C2C7"/>
  <circle cx="566" cy="405" r="14" fill="#E5484D"/>
  <text x="561" y="410" fill="#FFFFFF" style="font-family:'Segoe UI';font-size:14px;font-weight:800;">3</text>
  <text x="596" y="396" class="body">핵심 서비스 중지</text>
  <text x="596" y="420" class="small">서버는 켜져 있어도 실제 서비스 장애</text>

  <line x1="708" y1="444" x2="708" y2="473" class="arrow"/>

  <rect x="536" y="476" width="344" height="78" rx="14" fill="#FFF1F1" stroke="#F5C2C7"/>
  <circle cx="566" cy="515" r="14" fill="#E5484D"/>
  <text x="561" y="520" fill="#FFFFFF" style="font-family:'Segoe UI';font-size:14px;font-weight:800;">3</text>
  <text x="596" y="506" class="body">levelCode = 3 지표 존재</text>
  <text x="596" y="530" class="small">CPU, 메모리, 디스크, 네트워크 등</text>

  <line x1="708" y1="554" x2="708" y2="583" class="arrow"/>

  <rect x="536" y="586" width="344" height="78" rx="14" fill="#FFF7E8" stroke="#F5D49B"/>
  <circle cx="566" cy="625" r="14" fill="#D98A00"/>
  <text x="561" y="630" fill="#FFFFFF" style="font-family:'Segoe UI';font-size:14px;font-weight:800;">2</text>
  <text x="596" y="616" class="body">levelCode = 2 지표 존재</text>
  <text x="596" y="640" class="small">주의가 필요한 상태, operationCode = 2</text>

  <line x1="708" y1="664" x2="708" y2="693" class="arrow"/>

  <rect x="536" y="696" width="344" height="52" rx="14" fill="#EEF9F2" stroke="#BDE5CA"/>
  <circle cx="566" cy="722" r="14" fill="#168A4A"/>
  <text x="561" y="727" fill="#FFFFFF" style="font-family:'Segoe UI';font-size:14px;font-weight:800;">1</text>
  <text x="596" y="727" class="body">모든 지표 정상, operationCode = 1</text>

  <!-- API panel -->
  <rect x="956" y="146" width="380" height="408" rx="18" class="card"/>
  <text x="988" y="198" class="panelTitle">Make&amp;View 연결 필드</text>
  <text x="988" y="228" class="small">프론트는 아래 값만 보면 됩니다.</text>

  <rect x="988" y="262" width="316" height="126" rx="14" fill="#F8FBFD" stroke="#DFE7EF"/>
  <text x="1012" y="292" class="code">GET /api/server/{server}</text>
  <text x="1012" y="324" class="small">장비요약 카드</text>
  <text x="1012" y="354" class="body">powercode, operationCode</text>
  <text x="1012" y="378" class="body">checkMessage, alertNum</text>

  <rect x="988" y="414" width="316" height="106" rx="14" fill="#F8FBFD" stroke="#DFE7EF"/>
  <text x="1012" y="444" class="code">GET /api/metric/{server}/{metric}</text>
  <text x="1012" y="476" class="small">CPU, 메모리, 디스크, 네트워크</text>
  <text x="1012" y="506" class="body">powercode, display, levelCode</text>

  <!-- Overall flow -->
  <rect x="956" y="582" width="380" height="196" rx="18" class="card"/>
  <text x="988" y="632" class="panelTitle">화면 흐름</text>

  <rect x="988" y="668" width="74" height="42" rx="12" class="chip"/>
  <text x="1025" y="695" text-anchor="middle" class="small">QR 앱</text>
  <line x1="1062" y1="689" x2="1094" y2="689" class="arrow"/>

  <rect x="1098" y="668" width="74" height="42" rx="12" class="chip"/>
  <text x="1135" y="695" text-anchor="middle" class="small">로그인</text>
  <line x1="1172" y1="689" x2="1204" y2="689" class="arrow"/>

  <rect x="1208" y="668" width="96" height="42" rx="12" fill="#EEF9F2" stroke="#BDE5CA"/>
  <text x="1256" y="695" text-anchor="middle" class="small">장비요약</text>

  <line x1="1256" y1="710" x2="1256" y2="728" stroke="#96A3B4" stroke-width="2"/>
  <rect x="988" y="732" width="84" height="34" rx="10" class="chip"/>
  <text x="1030" y="754" text-anchor="middle" class="small">모니터링</text>
  <rect x="1090" y="732" width="64" height="34" rx="10" class="chip"/>
  <text x="1122" y="754" text-anchor="middle" class="small">알림</text>
  <rect x="1172" y="732" width="60" height="34" rx="10" class="chip"/>
  <text x="1202" y="754" text-anchor="middle" class="small">그래프</text>
  <rect x="1250" y="732" width="54" height="34" rx="10" class="chip"/>
  <text x="1277" y="754" text-anchor="middle" class="small">상세</text>

  <!-- Legend -->
  <rect x="64" y="832" width="1272" height="54" rx="16" fill="#FFFFFF" stroke="#DDE6EE"/>
  <text x="96" y="866" class="small">색상 규칙:</text>
  <circle cx="182" cy="861" r="7" fill="#7A8594"/>
  <text x="198" y="866" class="small">0 전원OFF</text>
  <circle cx="306" cy="861" r="7" fill="#168A4A"/>
  <text x="322" y="866" class="small">1 클린</text>
  <circle cx="414" cy="861" r="7" fill="#D98A00"/>
  <text x="430" y="866" class="small">2 경고</text>
  <circle cx="522" cy="861" r="7" fill="#E5484D"/>
  <text x="538" y="866" class="small">3 위험</text>
  <text x="678" y="866" class="small">디스크는 전체 용량 대비 사용률(%)로 표시하고, 서비스 상태는 실제 핵심 프로그램 실행 여부를 뜻합니다.</text>
</svg>
